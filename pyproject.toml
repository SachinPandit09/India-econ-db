[project]
name = "econdb"
version = "0.1.0"
description = "India Economic Database - FinSkeptics internal"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[project.scripts]
econdb = "econdb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["explore", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
